<VirtualHost *:8080>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html
    DirectoryIndex index.html
    
    # API endpoints (must come first)
    ScriptAlias /server/api /var/www/cgi-bin/rdn_server/rdn_api
    ScriptAlias /server/health /var/www/cgi-bin/rdn_server/health
    
    # CGI Scripts for specific endpoints (must come before Alias)
    ScriptAlias /server/rdn_console /var/www/cgi-bin/rdn_server/rdn_console
    ScriptAlias /server/rdn_login /var/www/cgi-bin/rdn_server/rdn_login
    ScriptAlias /server/rdn_webcmd /var/www/cgi-bin/rdn_server/rdn_webcmd
    ScriptAlias /server/rdn_webcmd_server /var/www/cgi-bin/rdn_server/rdn_webcmd_server
    ScriptAlias /server/rdn_security /var/www/cgi-bin/rdn_server/rdn_security
    ScriptAlias /server/rdn_session /var/www/cgi-bin/rdn_server/rdn_session
    ScriptAlias /server/rdn_database /var/www/cgi-bin/rdn_server/rdn_database
    ScriptAlias /server/client /var/www/cgi-bin/rdn_server/client
    ScriptAlias /server/rdn_auth_check /var/www/cgi-bin/rdn_server/rdn_auth_check
    ScriptAlias /server/rdn_logout /var/www/cgi-bin/rdn_server/rdn_logout
    
    # Full CGI path support
    ScriptAlias /server/cgi-bin/rdn_server/rdn_auth_check /var/www/cgi-bin/rdn_server/rdn_auth_check
    ScriptAlias /server/cgi-bin/rdn_server/rdn_logout /var/www/cgi-bin/rdn_server/rdn_logout
    ScriptAlias /server/cgi-bin/rdn_server/rdn_login /var/www/cgi-bin/rdn_server/rdn_login
    
    # Main application - serve HTML interface for /server/
    Alias /server /var/www/html
    
    <Directory "/var/www/cgi-bin/rdn_server">
        AllowOverride None
        Options +ExecCGI
        Require all granted
        SetHandler cgi-script
    </Directory>
    
    <Directory "/var/www/html">
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.html
    </Directory>
    
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
