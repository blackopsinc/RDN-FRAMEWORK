require "/var/www/cgi-bin/rdn_server/rdn_database";

$rdn_copy = "2004-2025";
$rdn_title = "RDNetworks Enhanced";
$rdn_version = "7.0.0";
$rdn_codename = "(RedDevil Enhanced)";

#
# Environment Configuration
#
$rdn_env = $ENV{'RDN_ENV'} || "development";
$rdn_log_level = $ENV{'RDN_LOG_LEVEL'} || "info";

#
# Local Setup
#
#$rdn_hostname = "localhost";
#$rdn_server = "http://" . $rdn_hostname;
#$rdn_port = ":8080";

#
# Codespace Setup (uncomment for GitHub Codespaces)
# 
$rdn_hostname = "jubilant-potato-64qxpg9q5pxc5gg9-443.app.github.dev";
$rdn_server = "https://" . $rdn_hostname;
$rdn_port = "";

#
# Production Setup (uncomment for production)
#
# $rdn_hostname = "your-domain.com";
# $rdn_server = "https://" . $rdn_hostname;

# The cgi-bin may include an alias
$rdn_bin = "server";

# Choose "default" theme or create your own
$rdn_theme = "default";

#
# Security Configuration
#
$rdn_session_timeout = 3600; # 1 hour
$rdn_max_login_attempts = 5;
$rdn_lockout_duration = 900; # 15 minutes
$rdn_enable_2fa = 0; # Set to 1 to enable 2FA
$rdn_password_min_length = 12;
$rdn_require_password_complexity = 1;

#
# Rate Limiting
#
$rdn_rate_limit_requests = 100;
$rdn_rate_limit_window = 3600; # 1 hour

#
# Logging Configuration
#
$rdn_log_file = "/var/log/rdn/rdn.log";
$rdn_audit_log = "/var/log/rdn/audit.log";
$rdn_error_log = "/var/log/rdn/error.log";

#
# RDN Database Configuration
#
$rdn_db_host = "172.20.0.200";
$rdn_db_schema = "rdn";
$rdn_db_user = "root";
$rdn_db_pass = "changeme";
$rdn_db_port = "3306";
$rdn_db_pool_size = 10;
$rdn_db_timeout = 30;

#
# Redis Configuration (for session management and caching)
#
$rdn_redis_host = "172.20.0.150";
$rdn_redis_port = "6379";
$rdn_redis_timeout = 5;

#
# SSL/TLS Configuration
#
$rdn_ssl_enabled = 0; # Set to 1 for HTTPS
$rdn_ssl_cert_path = "/etc/nginx/ssl/rdn.crt";
$rdn_ssl_key_path = "/etc/nginx/ssl/rdn.key";

#
# API Configuration
#
$rdn_api_enabled = 1;
$rdn_api_version = "v1";
$rdn_api_rate_limit = 1000; # requests per hour

#
# RDN Client Key
#
$rdn_client_key = &rdn_get_key("client");

#
# RDN Global Key
#
$rdn_global_key = &rdn_get_key("global");

#
# RDN Session Key
#
$rdn_key = &rdn_get_key("session");

#
# RDN Allow Clients (ACL) - Enhanced with CIDR notation
#
@rdn_hosts = (
    "127.0.0.0/8",      # Localhost
    "172.20.0.0/24",    # Docker network
    "10.0.0.0/8",       # Private network
    "192.168.0.0/16",   # Private network
    "0.0.0.0/0"         # Allow all (for GitHub Codespaces)
);

#
# Blocked IPs (blacklist)
#
@rdn_blocked_ips = ();

#
# Feature Flags
#
$rdn_enable_web_console = 1;
$rdn_enable_file_manager = 1;
$rdn_enable_system_monitor = 1;
$rdn_enable_network_scanner = 0; # Disabled by default for security
$rdn_enable_backup_system = 1;

#
# Backup Configuration
#
$rdn_backup_enabled = 1;
$rdn_backup_interval = 86400; # 24 hours
$rdn_backup_retention = 7; # days
$rdn_backup_path = "/backup";

#
# Notification Configuration
#
$rdn_notifications_enabled = 1;
$rdn_email_notifications = 0;
$rdn_webhook_notifications = 0;

1;
