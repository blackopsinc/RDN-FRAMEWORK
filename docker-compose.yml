version: '3.8'

services:
  rdn_server:
    image: blackopsinc/rdnserver:latest
    container_name: rdn-server
    command: bash -c "sh /var/www/cgi-bin/rdn_server/install.sh; apache2ctl -D FOREGROUND"
    ports:
      - '127.0.0.1:8080:8080'
    volumes:
      - ./rdn_server:/var/www/
      - ./logs:/var/log/rdn
    hostname: rdn_server
    restart: unless-stopped
    environment:
      - RDN_ENV=production
      - RDN_LOG_LEVEL=info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/server/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      rdn_net:
        ipv4_address: 172.20.0.101
    depends_on:
      rdn_data:
        condition: service_healthy

  rdn_data:
    image: blackopsinc/rdndata:latest
    container_name: rdn-data
    environment:
      - MYSQL_DATABASE=rdn
      - MYSQL_ROOT_PASSWORD=changeme
      - MYSQL_USER=rdn_user
      - MYSQL_PASSWORD=rdn_secure_pass
    ports:
      - '127.0.0.1:3306:3306'
    volumes:
      - rdn_mysql_data:/var/lib/mysql
      - ./rdn_data/db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./rdn_data/db/backup:/backup
    hostname: rdn_data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pchangeme"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      rdn_net:
        ipv4_address: 172.20.0.200

  rdn_redis:
    image: redis:7-alpine
    container_name: rdn-redis
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - rdn_redis_data:/data
      - ./rdn_data/redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      rdn_net:
        ipv4_address: 172.20.0.150

  rdn_nginx:
    image: nginx:alpine
    container_name: rdn-nginx
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
      - ./logs/nginx:/var/log/nginx
    restart: unless-stopped
    depends_on:
      - rdn_server
    networks:
      rdn_net:
        ipv4_address: 172.20.0.50

networks:
  rdn_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
          gateway: 172.20.0.1

volumes:
  rdn_mysql_data:
    driver: local
  rdn_redis_data:
    driver: local
